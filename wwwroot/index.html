<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物料库存管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .container {
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="mb-4 text-center">物料库存管理</h2>

        <button class="btn btn-danger mb-3" onclick="logout()">退出登录</button>
        <button class="btn btn-outline-secondary mb-3 ms-2" onclick="load()">刷新</button>

        <div class="card p-3 mb-3">
            <h5>新增物料</h5>
            <input class="form-control mb-2" id="name" placeholder="物料名称">
            <input class="form-control mb-2" id="code" placeholder="物料编码">
            <input class="form-control mb-2" id="stock" placeholder="库存数量" type="number">
            <input class="form-control mb-2" id="remark" placeholder="备注">
            <button class="btn btn-primary" onclick="add()">新增提交</button>
        </div>

        <table class="table table-bordered table-hover">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>物料名称</th>
                    <th>物料编码</th>
                    <th>库存数量</th>
                    <th>备注</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="list"></tbody>
        </table>
    </div>

    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5>修改物料</h5>
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="eId">
                    <input class="form-control mb-2" id="eName">
                    <input class="form-control mb-2" id="eCode">
                    <input class="form-control mb-2" id="eStock">
                    <input class="form-control mb-2" id="eRemark">
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                    <button class="btn btn-primary" onclick="saveEdit()">保存修改</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const token = localStorage.getItem("token");
        if (!token) {
            alert("请先登录！");
            location.href = "login.html";
        }

        const api = "/api/Material";
        const headers = {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
        };

        window.onload = load;

        // ==========================
        // 万能加载方法：不管后端返回结构，都能显示
        // ==========================
        async function load() {
            try {
                const res = await fetch(api, { headers });
                let result = await res.json();

                // 重点：自动兼容数组 / 包裹对象
                let list = Array.isArray(result) ? result : (result.data ?? result);

                console.log("实际拿到的数据：", list); // 看控制台一定有

                const html = list.map(m => `
                    <tr>
                        <td>${m.id}</td>
                        <td>${m.name}</td>
                        <td>${m.code}</td>
                        <td>${m.stockNumber}</td>
                        <td>${m.remark || ''}</td>
                        <td>
                            <button class="btn btn-sm btn-warning" onclick="edit(${m.id})">修改</button>
                            <button class="btn btn-sm btn-danger" onclick="del(${m.id})">删除</button>
                        </td>
                    </tr>
                    `).join("");

                document.getElementById("list").innerHTML = html;
            }
            catch (e) {
                console.error("加载失败", e);
                alert("加载失败：" + e.message);
            }
        }

        async function edit(id) {
            const res = await fetch(`${api}/${id}`, { headers });
            const m = await res.json();
            document.getElementById("eId").value = m.id;
            document.getElementById("eName").value = m.name;
            document.getElementById("eCode").value = m.code;
            document.getElementById("eStock").value = m.stockNumber;
            document.getElementById("eRemark").value = m.remark || "";
            new bootstrap.Modal(document.getElementById("editModal")).show();
        }

        async function saveEdit() {
            const model = {
                id: parseInt(document.getElementById("eId").value),
                name: document.getElementById("eName").value,
                code: document.getElementById("eCode").value,
                stockNumber: parseInt(document.getElementById("eStock").value),
                remark: document.getElementById("eRemark").value
            };
            await fetch(`${api}/${model.id}`, {
                method: "PUT",
                headers: headers,
                body: JSON.stringify(model)
            });
            bootstrap.Modal.getInstance(document.getElementById("editModal")).hide();
            load();
            showTip("修改成功");
        }

        async function add() {
            const model = {
                name: document.getElementById("name").value,
                code: document.getElementById("code").value,
                stockNumber: parseInt(document.getElementById("stock").value || 0),
                remark: document.getElementById("remark").value
            };
            await fetch(api, {
                method: "POST",
                headers: headers,
                body: JSON.stringify(model)
            });
            document.getElementById("name").value = "";
            document.getElementById("code").value = "";
            document.getElementById("stock").value = "";
            document.getElementById("remark").value = "";
            load();
            showTip("新增成功");
        }

        async function del(id) {
            if (!confirm("确定删除？")) return;
            await fetch(`${api}/${id}`, { method: "DELETE", headers });
            load();
            showTip("删除成功");
        }

        function logout() {
            localStorage.clear();
            location.href = "login.html";
        }

        function showTip(msg) {
            const div = document.createElement("div");
            div.style.cssText = "position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:10px 20px;background:#198754;color:white;border-radius:5px;z-index:9999";
            div.textContent = msg;
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 2000);
        }
    </script>
</body>
</html>
