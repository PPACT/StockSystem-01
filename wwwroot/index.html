<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物料库存管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .container {
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="mb-4 text-center">物料库存管理</h2>

        <!-- 退出登录按钮 -->
        <button class="btn btn-danger mb-3" onclick="logout()">退出登录</button>

        <div class="card p-3 mb-3">
            <h5>新增物料</h5>
            <div class="mb-2">
                <input class="form-control" id="name" placeholder="物料名称">
            </div>
            <div class="mb-2">
                <input class="form-control" id="code" placeholder="物料编码">
            </div>
            <div class="mb-2">
                <input class="form-control" id="stock" placeholder="库存数量" type="number">
            </div>
            <div class="mb-2">
                <input class="form-control" id="remark" placeholder="备注">
            </div>
            <button class="btn btn-primary" onclick="add()">新增提交</button>
        </div>

        <table class="table table-bordered table-hover">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>物料名称</th>
                    <th>物料编码</th>
                    <th>库存数量</th>
                    <th>备注</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="list"></tbody>
        </table>
    </div>

    <!-- 修改弹窗 -->
    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5>修改物料</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="eId">
                    <div class="mb-2">
                        <input class="form-control" id="eName" placeholder="物料名称">
                    </div>
                    <div class="mb-2">
                        <input class="form-control" id="eCode" placeholder="物料编码">
                    </div>
                    <div class="mb-2">
                        <input class="form-control" id="eStock" placeholder="库存数量" type="number">
                    </div>
                    <div class="mb-2">
                        <input class="form-control" id="eRemark" placeholder="备注">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                    <button type="button" class="btn btn-primary" onclick="saveEdit()">保存修改</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ==========================================
        // ===== 登录判断：没登录直接跳回登录页 =====
        // ==========================================
        const token = localStorage.getItem("token");
        if (!token) {
            alert("请先登录！");
            location.href = "login.html"; // 跳转到登录页面
        }

        const api = "/api/Material";

        // ==========================================
        // ===== 所有请求自动带上 token =====
        // ==========================================
        function getAuthHeaders() {
            return {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + token // 关键：给后端鉴权
            };
        }

        window.onload = load;

        // 加载列表
        async function load() {
            const res = await fetch(api, {
                cache: "no-cache",
                headers: getAuthHeaders() // 带token
            });
            const result = await res.json();
            const list = result.data || [];
            const html = list.map(m => `
                    <tr>
                        <td>${m.id}</td>
                        <td>${m.name}</td>
                        <td>${m.code}</td>
                        <td>${m.stockNumber}</td>
                        <td>${m.remark || '-'}</td>
                        <td>
                            <button class="btn btn-sm btn-warning" onclick="edit(${m.id})">修改</button>
                            <button class="btn btn-sm btn-danger" onclick="del(${m.id})">删除</button>
                        </td>
                    </tr>
                    `).join("");
            document.getElementById("list").innerHTML = html;
        }

        // 打开修改
        async function edit(id) {
            const res = await fetch(`${api}/${id}`, {
                headers: getAuthHeaders()
            });
            const m = await res.json();
            document.getElementById("eId").value = m.id;
            document.getElementById("eName").value = m.name;
            document.getElementById("eCode").value = m.code;
            document.getElementById("eStock").value = m.stockNumber;
            document.getElementById("eRemark").value = m.remark || "";
            new bootstrap.Modal(document.getElementById("editModal")).show();
        }

        // 保存修改
        async function saveEdit() {
            const model = {
                id: parseInt(document.getElementById("eId").value),
                name: document.getElementById("eName").value,
                code: document.getElementById("eCode").value,
                stockNumber: parseInt(document.getElementById("eStock").value),
                remark: document.getElementById("eRemark").value
            };

            await fetch(`${api}/${model.id}`, {
                method: "PUT",
                headers: getAuthHeaders(),
                body: JSON.stringify(model)
            });

            bootstrap.Modal.getInstance(document.getElementById("editModal")).hide();
            load();
            showTip("修改成功！");
        }

        // 新增
        async function add() {
            const model = {
                name: document.getElementById("name").value,
                code: document.getElementById("code").value,
                stockNumber: parseInt(document.getElementById("stock").value || 0),
                remark: document.getElementById("remark").value
            };

            await fetch(api, {
                method: "POST",
                headers: getAuthHeaders(),
                body: JSON.stringify(model)
            });

            load();
            showTip("新增成功！");
        }

        // 删除
        async function del(id) {
            if (!confirm("确定删除该物料？")) return;

            await fetch(`${api}/${id}`, {
                method: "DELETE",
                headers: getAuthHeaders()
            });
            load();
            showTip("删除成功！");
        }

        // 退出登录
        function logout() {
            localStorage.removeItem("token");
            location.href = "login.html";
        }

        // 提示
        function showTip(msg) {
            const tip = document.createElement("div");
            tip.style.position = "fixed";
            tip.style.top = "20px";
            tip.style.left = "50%";
            tip.style.transform = "translateX(-50%)";
            tip.style.padding = "10px 25px";
            tip.style.backgroundColor = "#198754";
            tip.style.color = "#fff";
            tip.style.borderRadius = "6px";
            tip.style.zIndex = "9999";
            tip.innerText = msg;
            document.body.appendChild(tip);
            setTimeout(() => tip.remove(), 2000);
        }
    </script>
</body>
</html>
