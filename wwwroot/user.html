<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>用户管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h3>用户管理（仅管理员）</h3>
        <a href="index.html" class="btn btn-secondary mb-2">返回物料</a>
        <button class="btn btn-primary mb-2" data-bs-toggle="modal" data-bs-target="#addModal">新增用户</button>

        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>账号</th>
                    <th>管理员</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="userList"></tbody>
        </table>
    </div>

    <div class="modal fade" id="addModal">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header"><h5>新增用户</h5></div>
                <div class="modal-body">
                    <input class="form-control mb-2" id="username" placeholder="账号">
                    <input class="form-control mb-2" id="password" placeholder="密码">
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button class="btn btn-primary" onclick="addUser()">保存</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const token = localStorage.getItem("token");
        if (!token) { location.href = "login.html"; }

        const isAdmin = localStorage.getItem("isAdmin") === "true";
        if (!isAdmin) {
            alert("无权限！仅管理员可访问");
            location.href = "index.html";
        }

        const headers = {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
        };

        window.onload = load;

        async function load() {
            const res = await fetch("/api/User", { headers });
            const list = await res.json();
            const html = list.map(u => `
            <tr>
                <td>${u.id}</td>
                <td>${u.username}</td>
                <td>${u.isAdmin?"是":"否"}</td>
                <td>
                    <button class="btn btn-sm btn-danger" onclick="del(${u.id})">删除</button>
                </td>
            </tr>`).join("");
            userList.innerHTML = html;
        }

        async function addUser() {
            const user = {
                username: document.getElementById("username").value,
                password: document.getElementById("password").value
            };
            await fetch("/api/User", {
                method: "POST",
                headers: headers,
                body: JSON.stringify(user)
            });
            bootstrap.Modal.getInstance(addModal).hide();
            load();
        }

        async function del(id) {
            if (!confirm("确定删除？")) return;
            await fetch(`/api/User/${id}`, { method: "DELETE", headers });
            load();
        }
    </script>
</body>
</html>
