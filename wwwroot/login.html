<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物料库存管理系统 - 登录</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .login-container {
            margin: 80px auto;
            width: 400px;
            padding: 30px;
            border: 1px solid #eee;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .form-group {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h3 class="text-center mb-4">物料库存管理系统</h3>
        <div class="form-group">
            <label for="username">账号</label>
            <input type="text" id="username" class="form-control" placeholder="请输入账号" autocomplete="off">
        </div>
        <div class="form-group">
            <label for="password">密码</label>
            <input type="password" id="password" class="form-control" placeholder="请输入密码">
        </div>
        <button class="btn btn-primary w-100" onclick="login()">登录</button>
        <div id="errorMsg" class="text-danger text-center mt-3"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ==============================================
        // 一进来就看有没有“退出成功”提示
        // ==============================================
        const tipMsg = localStorage.getItem("tipMessage");
        if (tipMsg) {
            setTimeout(() => {
                showTip(tipMsg);
                localStorage.removeItem("tipMessage");
            }, 100);
        }

        const loginApi = "/api/Login";

        async function login() {
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value.trim();
            const errorMsg = document.getElementById("errorMsg");

            if (!username || !password) {
                errorMsg.innerText = "请输入账号和密码！";
                return;
            }

            try {
                const res = await fetch(loginApi, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });

                if (!res.ok) {
                    errorMsg.innerText = "账号或密码错误！";
                    return;
                }

                const data = await res.json();
                localStorage.setItem("token", data.token);
                // 登录成功，带到首页显示
                localStorage.setItem("tipMessage", "登录成功");
                location.href = "index.html";
            }
            catch (err) {
                errorMsg.innerText = "登录失败，请重试！";
            }
        }

        document.addEventListener("keydown", function (e) {
            if (e.key === "Enter") login();
        });

        // ==============================================
        // 提示框动画（下滑 + 渐隐）
        // ==============================================
        function showTip(msg) {
            const div = document.createElement("div");
            div.style.cssText = `
                    position: fixed;
                    top: 20px;
                    left: 50%;
                    transform: translateX(-50%) translateY(-30px);
                    padding: 10px 20px;
                    background: #198754;
                    color: white;
                    border-radius: 6px;
                    z-index: 9999;
                    opacity: 0;
                    transition: all 0.4s ease;
                    pointer-events: none;
                `;
            div.textContent = msg;
            document.body.appendChild(div);

            setTimeout(() => {
                div.style.opacity = "1";
                div.style.transform = "translateX(-50%) translateY(0)";
            }, 10);

            setTimeout(() => {
                div.style.opacity = "0";
                div.style.transform = "translateX(-50%) translateY(-20px)";
            }, 1600);

            setTimeout(() => {
                div.remove();
            }, 2000);
        }
    </script>
</body>
</html>
